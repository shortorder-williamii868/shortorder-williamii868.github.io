name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AF8B65: ${{ secrets.AF8B65 }}
          B4FA6A: ${{ secrets.B4FA6A }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AF8B65', '')
          bm = os.environ.get('B4FA6A', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- c3e2ed3673f4018719 -->', gm)
          if bm:
              s2 = s2.replace('<!-- ce87a5c9eb4b64f50dfb3a8a61ca804f467cce662aaa1f -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
